# Render blueprint for the FraudStream AI detection engine.
#
# Render builds and starts from `rootDir`, so every relative path the engine
# resolves (models/, data/) lines up with the local layout.
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repository.
# Values marked `sync: false` are NOT stored in git; Render prompts for them
# on first deploy and keeps them in its own encrypted store.

services:
  - type: web
    name: fraudstream-ai-engine
    runtime: python
    plan: free
    region: singapore
    rootDir: ml-engine
    buildCommand: pip install -r requirements.txt
    # A single worker is required, not a preference. The pseudo-stream runs on a
    # background thread inside the process and keeps its counters in memory, so
    # a second worker would run a second independent stream and split the state.
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # numpy 2.1.3 / xgboost 2.1.3 need 3.10+; pinned so a Render default bump
      # cannot silently change the wheel set under the model.
      - key: PYTHON_VERSION
        value: 3.11.9

      # --- Supabase. Set these in the dashboard, never in the repo. ---
      # REQUIRED, because REQUIRE_AUTH is "true" below. SUPABASE_URL and
      # SUPABASE_ANON_KEY are what verify a dashboard user's access token; the
      # service-role key is what persists results. With them missing the engine
      # 503s every protected route by design (config.auth_misconfigured) rather
      # than failing open, and /api/health says so.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false

      # --- Access ---
      # Every route except /api/health requires a Supabase access token. This
      # was "false", which meant the dashboard's login was decorative: the
      # browser signed users in against Supabase while the engine accepted any
      # request that reached it, so anyone with this URL could list uploads,
      # upload a 250 MB CSV, or restart the stream everyone was watching.
      #
      # This flag is only honoured when the Supabase keys above are set. If they
      # are missing the engine refuses protected routes with 503 instead of
      # serving them open — the failure is loud, and visible on /api/health.
      - key: REQUIRE_AUTH
        value: "true"
      # Only needed for a dashboard on a custom domain. The engine already
      # matches localhost and this project's Vercel hosts by shape (see
      # config.cors_origin_regex), because Vercel issues a new hostname per
      # project and per preview — an exact list here goes stale on the next
      # deploy, and a stale list is invisible from here: the engine keeps
      # answering 200 while the browser drops every response, so the dashboard
      # reports an unreachable engine and the logs show a healthy one.
      # Scheme included, no trailing slash.
      - key: CORS_ORIGINS
        sync: false

      # --- Artifact locations, relative to rootDir ---
      - key: MODEL_PATH
        value: models/fraud_model.joblib
      - key: PREPROCESSOR_PATH
        value: models/preprocessor.joblib
      - key: MODEL_METADATA_PATH
        value: models/model_metadata.json
      - key: STREAM_DATA_PATH
        value: data/stream_test.csv

      # --- Runtime behaviour ---
      - key: STREAM_DELAY_MS
        value: "120"
      # The free plan stops this instance after ~15 minutes without a request
      # and every dashboard counter lives in its memory, so a wake would
      # otherwise serve a healthy engine with an idle stream and no data — which
      # reads as "the demo is broken". Starting the stream on boot makes the
      # instance restore itself after any stop. The keepalive workflow in
      # .github/workflows/keepalive.yml is what stops it sleeping in the first
      # place; this is what makes a sleep survivable.
      - key: STREAM_AUTOSTART
        value: "true"
      - key: PERSIST_BATCH_SIZE
        value: "25"
      - key: LOG_LEVEL
        value: INFO
