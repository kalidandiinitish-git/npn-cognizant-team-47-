name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  ml-engine:
    name: ML engine tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml-engine/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        # The dataset and trained artifacts are not committed, so the tests that
        # need them skip themselves. Everything else must pass.
        run: python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if package.json has drifted from it, so a green build here means
      # the same dependency tree a developer had, not merely a resolvable one.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
